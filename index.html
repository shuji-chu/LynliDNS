<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LynliDNS - 注册</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; }
    .logo { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #111; margin: 0 0 8px; }
    p.subtitle { font-size: 13px; color: #666; margin: 0 0 24px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #4A90D9; }
    .code-btn { width: 120px; padding: 0 10px; background: #f0f0f0; border: none; border-radius: 10px; font-size: 13px; color: #333; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    .code-btn:disabled { color: #999; cursor: not-allowed; }
    .btn { width: 100%; padding: 14px; background: #4A90D9; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    .btn:hover { background: #357ABD; }
    .btn:disabled { background: #a0c4e8; cursor: not-allowed; }
    .cf-turnstile { display: flex; justify-content: center; margin-bottom: 8px; }
    #msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .msg-error { color: #e74c3c; }
    .msg-success { color: #27ae60; }
</style>
</head>
<body>
<div class="card">
    <img src="logo.png" alt="LynliDNS" class="logo">
    <h1>LynliDNS</h1>
    <p class="subtitle">注册账号，免费领取你的二级域名</p>

    <form id="registerForm">
        <input type="text" id="username" placeholder="用户名" required autocomplete="username">
        <div class="input-group">
            <input type="email" id="email" placeholder="真实邮箱" required autocomplete="email">
            <button type="button" class="code-btn" id="sendCodeBtn">获取验证码</button>
        </div>
        <input type="text" id="code" placeholder="邮箱验证码" required>
        <input type="password" id="password" placeholder="密码（至少8位）" required minlength="8" autocomplete="new-password">
        
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFUX4BAAh7lzp1mNJZZf_qG5LJA"></div>
        <button type="submit" class="btn" id="submitBtn">注册账号</button>
        <div id="msg"></div>
    </form>
</div>

<script>
const sendBtn = document.getElementById('sendCodeBtn');
const msgDiv = document.getElementById('msg');

// 发送验证码
sendBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    if (!email) { alert('请先填写邮箱'); return; }
    
    sendBtn.disabled = true;
    sendBtn.innerText = '发送中...';
    
    try {
        const res = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        alert(data.msg);
        if (data.success) {
            let countdown = 60;
            sendBtn.innerText = countdown + '秒后重试';
            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.innerText = '获取验证码';
                } else {
                    sendBtn.innerText = countdown + '秒后重试';
                }
            }, 1000);
        } else {
            sendBtn.disabled = false;
            sendBtn.innerText = '获取验证码';
        }
    } catch (err) {
        sendBtn.disabled = false;
        sendBtn.innerText = '获取验证码';
        alert('网络错误，请重试');
    }
});

// 提交注册
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const turnstileToken = document.querySelector('[name="cf-turnstile-response"]').value;
    if (!turnstileToken) { 
        msgDiv.className = 'msg-error'; 
        msgDiv.innerText = '请先完成人机验证'; 
        return; 
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = '注册中...';
    msgDiv.innerText = '';

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                code: document.getElementById('code').value,
                turnstileToken: turnstileToken
            })
        });
        const data = await res.json();
        if (data.success) {
            msgDiv.className = 'msg-success';
            msgDiv.innerText = '注册成功！即将跳转...';
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
            msgDiv.className = 'msg-error';
            msgDiv.innerText = data.msg || '注册失败';
            if (window.turnstile) window.turnstile.reset();
        }
    } catch (err) {
        msgDiv.className = 'msg-error';
        msgDiv.innerText = '网络错误，请重试';
    } finally {
        btn.disabled = false;
        btn.innerText = '注册账号';
    }
});
</script>
</body>
</html>
